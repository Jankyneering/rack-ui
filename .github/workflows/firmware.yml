name: firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/src

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Verify toolchain
        run: which arm-none-eabi-gcc && arm-none-eabi-gcc --version

      - name: Build firmware
        # rules.mk builds PREFIX = $(ARM_TOOLCHAIN)/arm-none-eabi-, so point at
        # the directory that actually contains the binaries (/usr/bin, not /usr).
        run: make ARM_TOOLCHAIN=/usr/bin all

      - name: Print size
        run: arm-none-eabi-size Build/app.elf

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: software/src/Build/

  nightly-release:
    # Publish the firmware built from the tip of main to a rolling "nightly"
    # release. The release and its tag are recreated on every push, so the
    # download always matches the latest commit.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Nightly build (${SHORT_SHA})" \
            --notes "Automated firmware build from the tip of \`main\` (commit ${GITHUB_SHA}).

          Contains \`app.bin\` (raw binary for flashing), plus \`app.hex\` and \`app.elf\`. See [software/src/README.md](software/src/README.md) for flashing instructions and the I2C register map." \
            firmware/app.bin firmware/app.hex firmware/app.elf
